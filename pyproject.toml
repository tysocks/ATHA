[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atha"
version = "0.1.0"
description = "Advanced Transient and High-fidelity Analysis for rocket engines"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "cantera>=3.0",
    "CoolProp>=6.6",
    "pydantic>=2.0",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "h5py>=3.10",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
atha-run = "atha.cli:main"

[tool.setuptools.packages.find]
include = ["atha*"]

[tool.pytest.ini_options]
markers = [
    "slow: full-engine mission-cycle verification gates",
]
testpaths = ["tests"]
