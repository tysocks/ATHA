[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atha"
version = "0.1.0"
description = "Advanced Transient and High-fidelity Analysis for rocket engines"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "cantera>=3.0",
    "CoolProp>=6.6",
    "pydantic>=2.0",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "h5py>=3.10",
    "joblib>=1.3",
    "SALib>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "plotly>=5.0"]

[tool.setuptools.packages.find]
include = ["atha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
