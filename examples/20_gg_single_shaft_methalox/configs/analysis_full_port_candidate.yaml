name: gg_single_shaft_methalox_full_port_candidate
engine: engine_full_port_candidate.yaml
maps:
  lox_pump_affinity: maps/lox_pump_affinity.yaml
  methane_pump_affinity: maps/methane_pump_affinity.yaml
  turbine_affinity: maps/turbine_affinity.yaml
boundary_conditions: boundaries.yaml
operating_conditions: operating_conditions.yaml
controllers: controller.yaml
transients: transients.yaml
timings: timings.yaml
telemetry: telemetry.yaml
solver:
  transient:
    method: Radau
    rtol: 1.0e-7
    atol: 1.0e-6
    max_step: 0.05
analysis:
  type: profile
  solve_policy:
    checked: false
    residual_tolerance: 1.0e-6
    strict_sources: true
    corrector: endpoint
    corrector_iterations: 2
    preconditioner: design
    max_nfev: 20
  integration:
    segment_at_controller_samples: false
  time:
    start_s: 0.0
    end_s: 30.0
    phases:
      - {name: startup, start_s: 0.0, end_s: 3.0}
      - {name: CLC, start_s: 3.0, end_s: 25.0}
      - {name: shutdown, start_s: 25.0, end_s: 30.0}
  design:
    thrust: 150000.0
    chamber_pressure: 5.0e6
    mdot_total: 40.0
    OF: 3.2
  initial_conditions:
    shaft.rpm: 24000.0
    chamber.P: 4.0e6
    generator.P: 6.0e6
  output:
    csv: gg_single_shaft_methalox_full_port_candidate.csv
    plot: gg_single_shaft_methalox_full_port_candidate.png
    diagnostics: gg_single_shaft_methalox_full_port_candidate.diagnostics.json
