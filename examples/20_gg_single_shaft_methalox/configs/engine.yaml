name: gg_single_shaft_methalox
units: SI
components:
  shaft:
    type: Rotor
    parameters:
      moment_of_inertia: 0.18
      friction_coeff: 0.018
  lox_pump:
    type: Pump
    parameters:
      diameter: 0.145
      pump_map: {mdot_design: 30.48, dP_design: 12.0e6, speed_design: 32000, efficiency_design: 0.74, rho_design: 1140.0}
    maps:
      head_map: {ref: lox_pump_affinity, output: psi}
      efficiency_map: {ref: lox_pump_affinity, output: eta}
  methane_pump:
    type: Pump
    parameters:
      diameter: 0.090
      pump_map: {mdot_design: 9.52, dP_design: 12.5e6, speed_design: 32000, efficiency_design: 0.69, rho_design: 422.0}
    maps:
      head_map: {ref: methane_pump_affinity, output: psi}
      efficiency_map: {ref: methane_pump_affinity, output: eta}
  lox_pump_discharge_pipe: {type: Pipe, parameters: {length: 0.35, diameter: 0.055, mdot_design: 30.48}}
  methane_pump_discharge_pipe: {type: Pipe, parameters: {length: 0.35, diameter: 0.038, mdot_design: 9.52}}
  lox_splitter: {type: FlowSplitter, parameters: {split_fraction: 0.92}}
  methane_splitter: {type: FlowSplitter, parameters: {split_fraction: 0.92}}
  lox_main_pipe: {type: Pipe, parameters: {length: 0.50, diameter: 0.050, mdot_design: 28.0}}
  methane_main_pipe: {type: Pipe, parameters: {length: 0.50, diameter: 0.036, mdot_design: 8.8}}
  lox_generator_pipe: {type: Pipe, parameters: {length: 0.35, diameter: 0.020, mdot_design: 2.4}}
  methane_generator_pipe: {type: Pipe, parameters: {length: 0.35, diameter: 0.016, mdot_design: 0.8}}
  main_lox_valve: {type: Valve, transient: main_lox_valve, parameters: {CdA: 1.9e-4}}
  main_methane_valve: {type: Valve, transient: main_methane_valve, parameters: {CdA: 1.2e-4}}
  lox_generator_valve: {type: Valve, transient: lox_generator_valve, parameters: {CdA: 3.5e-5}}
  methane_generator_valve: {type: Valve, transient: methane_generator_valve, parameters: {CdA: 2.2e-5}}
  lox_main_valve_pipe: {type: Pipe, parameters: {length: 0.25, diameter: 0.050, mdot_design: 28.0}}
  methane_main_valve_pipe: {type: Pipe, parameters: {length: 0.25, diameter: 0.036, mdot_design: 8.8}}
  lox_generator_valve_pipe: {type: Pipe, parameters: {length: 0.20, diameter: 0.020, mdot_design: 2.4}}
  methane_generator_valve_pipe: {type: Pipe, parameters: {length: 0.20, diameter: 0.016, mdot_design: 0.8}}
  lox_injector: {type: MassFlowInjector, parameters: {delta_P_nominal: 1.0e6}}
  methane_injector: {type: MassFlowInjector, parameters: {delta_P_nominal: 1.0e6}}
  generator_lox_injector: {type: MassFlowInjector, parameters: {delta_P_nominal: 0.8e6}}
  generator_methane_injector: {type: MassFlowInjector, parameters: {delta_P_nominal: 0.8e6}}
  chamber:
    type: CombustionChamber
    parameters: {volume: 0.08, gas_R: 420.0, T_adiabatic: 3500.0, initial_P: 5.0e6, design_MR: 3.2}
  generator:
    type: Preburner
    parameters: {volume: 0.004, gas_R: 420.0, T_adiabatic: 1100.0, initial_P: 8.0e6, design_MR: 0.7}
  turbine:
    type: Turbine
    parameters:
      turbine_map: {mdot_design: 3.2, PR_design: 2.5, eta_design: 0.72, power_design: 6.5e5}
    maps:
      efficiency_map: {ref: turbine_affinity, output: efficiency}
  turbine_exhaust_pipe: {type: Pipe, parameters: {length: 0.60, diameter: 0.045, mdot_design: 3.2}}
  nozzle:
    type: Nozzle
    parameters: {throat_area: 2.11e-2, exit_area: 0.18, thrust_coefficient: 1.45}
connections:
  - {from: lox_pump.outlet, to: lox_pump_discharge_pipe.inlet, domain: fluid}
  - {from: lox_pump_discharge_pipe.outlet, to: lox_splitter.inlet, domain: fluid}
  - {from: lox_splitter.outlet_a, to: lox_main_pipe.inlet, domain: fluid}
  - {from: lox_main_pipe.outlet, to: main_lox_valve.inlet, domain: fluid}
  - {from: main_lox_valve.outlet, to: lox_main_valve_pipe.inlet, domain: fluid}
  - {from: lox_main_valve_pipe.outlet, to: lox_injector.inlet, domain: fluid}
  - {from: lox_injector.outlet, to: chamber.ox_inlet, domain: fluid}
  - {from: lox_splitter.outlet_b, to: lox_generator_pipe.inlet, domain: fluid}
  - {from: lox_generator_pipe.outlet, to: lox_generator_valve.inlet, domain: fluid}
  - {from: lox_generator_valve.outlet, to: lox_generator_valve_pipe.inlet, domain: fluid}
  - {from: lox_generator_valve_pipe.outlet, to: generator_lox_injector.inlet, domain: fluid}
  - {from: generator_lox_injector.outlet, to: generator.ox_inlet, domain: fluid}
  - {from: methane_pump.outlet, to: methane_pump_discharge_pipe.inlet, domain: fluid}
  - {from: methane_pump_discharge_pipe.outlet, to: methane_splitter.inlet, domain: fluid}
  - {from: methane_splitter.outlet_a, to: methane_main_pipe.inlet, domain: fluid}
  - {from: methane_main_pipe.outlet, to: main_methane_valve.inlet, domain: fluid}
  - {from: main_methane_valve.outlet, to: methane_main_valve_pipe.inlet, domain: fluid}
  - {from: methane_main_valve_pipe.outlet, to: methane_injector.inlet, domain: fluid}
  - {from: methane_injector.outlet, to: chamber.fuel_inlet, domain: fluid}
  - {from: methane_splitter.outlet_b, to: methane_generator_pipe.inlet, domain: fluid}
  - {from: methane_generator_pipe.outlet, to: methane_generator_valve.inlet, domain: fluid}
  - {from: methane_generator_valve.outlet, to: methane_generator_valve_pipe.inlet, domain: fluid}
  - {from: methane_generator_valve_pipe.outlet, to: generator_methane_injector.inlet, domain: fluid}
  - {from: generator_methane_injector.outlet, to: generator.fuel_inlet, domain: fluid}
  - {from: generator.outlet, to: turbine.inlet, domain: fluid}
  - {from: turbine.outlet, to: turbine_exhaust_pipe.inlet, domain: fluid}
  - {from: chamber.outlet, to: nozzle.inlet, domain: fluid}
  - {from: turbine.shaft, to: shaft.shaft, domain: shaft}
  - {from: lox_pump.shaft, to: shaft.shaft, domain: shaft}
  - {from: methane_pump.shaft, to: shaft.shaft, domain: shaft}
