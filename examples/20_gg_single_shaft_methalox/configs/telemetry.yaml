name: gg_single_shaft_methalox_telemetry
sample_rate_hz: 100
channels:
  - {alias: TIME, source: time, units: s}
  - {alias: TARGET_MDOT_TOTAL, source: target.mdot_total, units: kg/s}
  - {alias: TARGET_OF, source: target.OF}
  - {alias: MDOT_TOTAL, source: mdot.total, units: kg/s}
  - {alias: MDOT_METHANE, source: methane_pump.inlet.mdot, units: kg/s}
  - {alias: MDOT_LOX, source: lox_pump.inlet.mdot, units: kg/s}
  - {alias: LOX_PUMP_EFFICIENCY, source: lox_pump.efficiency}
  - {alias: LOX_PUMP_DP, source: lox_pump.delta_P, units: MPa}
  - {alias: LOX_PUMP_PHI, source: lox_pump.phi}
  - {alias: LOX_PUMP_PSI, source: lox_pump.psi}
  - {alias: LOX_PUMP_INLET_H, source: lox_pump.inlet.h, units: J/kg}
  - {alias: LOX_PUMP_OUTLET_H, source: lox_pump.outlet.h, units: J/kg}
  - {alias: METHANE_PUMP_EFFICIENCY, source: methane_pump.efficiency}
  - {alias: METHANE_PUMP_DP, source: methane_pump.delta_P, units: MPa}
  - {alias: METHANE_PUMP_PHI, source: methane_pump.phi}
  - {alias: METHANE_PUMP_PSI, source: methane_pump.psi}
  - {alias: METHANE_PUMP_INLET_H, source: methane_pump.inlet.h, units: J/kg}
  - {alias: METHANE_PUMP_OUTLET_H, source: methane_pump.outlet.h, units: J/kg}
  - {alias: OF, source: chamber.OF}
  - {alias: METHANE_GENERATOR_VALVE_COMMAND, source: methane_generator_valve.command}
  - {alias: METHANE_GENERATOR_OF_ERROR, source: controller.methane_generator_of_p.error}
  - {alias: METHANE_GENERATOR_OF_INTEGRAL, source: controller.methane_generator_of_p.integral}
  - {alias: METHANE_GENERATOR_OF_DERIVATIVE, source: controller.methane_generator_of_p.derivative}
  - {alias: METHANE_GENERATOR_P_TERM, source: controller.methane_generator_of_p.proportional_term}
  - {alias: METHANE_GENERATOR_I_TERM, source: controller.methane_generator_of_p.integral_term}
  - {alias: METHANE_GENERATOR_D_TERM, source: controller.methane_generator_of_p.derivative_term}
  - {alias: METHANE_GENERATOR_RAW_COMMAND, source: controller.methane_generator_of_p.raw_command}
  - {alias: METHANE_GENERATOR_VALVE_POSITION, source: methane_generator_valve.position}
  - {alias: LOX_GENERATOR_VALVE_COMMAND, source: lox_generator_valve.command}
  - {alias: LOX_GENERATOR_MDOT_ERROR, source: controller.lox_generator_mdot_p.error}
  - {alias: LOX_GENERATOR_MDOT_INTEGRAL, source: controller.lox_generator_mdot_p.integral}
  - {alias: LOX_GENERATOR_MDOT_DERIVATIVE, source: controller.lox_generator_mdot_p.derivative}
  - {alias: LOX_GENERATOR_P_TERM, source: controller.lox_generator_mdot_p.proportional_term}
  - {alias: LOX_GENERATOR_I_TERM, source: controller.lox_generator_mdot_p.integral_term}
  - {alias: LOX_GENERATOR_D_TERM, source: controller.lox_generator_mdot_p.derivative_term}
  - {alias: LOX_GENERATOR_RAW_COMMAND, source: controller.lox_generator_mdot_p.raw_command}
  - {alias: LOX_GENERATOR_VALVE_POSITION, source: lox_generator_valve.position}
  - {alias: MAIN_LOX_VALVE_POSITION, source: main_lox_valve.position}
  - {alias: MAIN_METHANE_VALVE_POSITION, source: main_methane_valve.position}
  - {alias: GENERATOR_P, source: generator.P, units: bar}
  - {alias: GENERATOR_MDOT, source: generator.mdot, units: kg/s}
  - {alias: SHAFT_RPM, source: shaft.rpm, units: rpm}
  - {alias: PC, source: chamber.P, units: bar}
  - {alias: THRUST, source: nozzle.thrust, units: N}




exports:
  csv: true
  plot: true
plots:
  - title: Target Tracking
    x: TIME
    y: [TARGET_MDOT_TOTAL, MDOT_TOTAL]
    ylabel: Mass flow [kg/s]
  - title: Mixture Ratio
    x: TIME
    y: [TARGET_OF, OF]
    ylabel: OF [-]
  - title: Methane Generator Valve
    x: TIME
    y: [METHANE_GENERATOR_VALVE_COMMAND, METHANE_GENERATOR_VALVE_POSITION]
    ylabel: Position [-]
  - title: LOx Generator Valve
    x: TIME
    y: [LOX_GENERATOR_VALVE_COMMAND, LOX_GENERATOR_VALVE_POSITION]
    ylabel: Position [-]
  - title: Shutdown
    x: TIME
    y: [MAIN_LOX_VALVE_POSITION, MAIN_METHANE_VALVE_POSITION]
    ylabel: Position
  - title: Shaft Speed Response
    x: TIME
    y: [SHAFT_RPM]
    ylabel: Speed [rpm]
  - title: Pump Head Response
    x: TIME
    y: [LOX_PUMP_DP, METHANE_PUMP_DP]
    ylabel: Pressure rise [MPa]
  - title: Thrust
    x: TIME
    y: [THRUST]
    ylabel: Thrust [N]
  - title: Controller Integral
    x: TIME
    y: [METHANE_GENERATOR_OF_INTEGRAL, LOX_GENERATOR_MDOT_INTEGRAL]
    ylabel: Integral
  - title: Controller Derivatives
    x: TIME
    y: [METHANE_GENERATOR_OF_DERIVATIVE, LOX_GENERATOR_MDOT_DERIVATIVE]
    ylabel: Derivative
  - title: Controller Raw Command
    x: TIME
    y: [METHANE_GENERATOR_RAW_COMMAND, LOX_GENERATOR_RAW_COMMAND]
    ylabel: Command
  - title: LOX PID Terms
    x: TIME
    y: [LOX_GENERATOR_P_TERM, LOX_GENERATOR_I_TERM, LOX_GENERATOR_D_TERM]
    ylabel: Command contribution
  - title: Methane PID Terms
    x: TIME
    y: [METHANE_GENERATOR_P_TERM, METHANE_GENERATOR_I_TERM, METHANE_GENERATOR_D_TERM]
    ylabel: Command contribution
  - title: Controller Error
    x: TIME
    y: [METHANE_GENERATOR_OF_ERROR, LOX_GENERATOR_MDOT_ERROR]
    ylabel: Delta
