name: gg_single_shaft_methalox
engine: engine.yaml
maps:
  lox_pump_affinity: maps/lox_pump_affinity.yaml
  methane_pump_affinity: maps/methane_pump_affinity.yaml
  turbine_affinity: maps/turbine_affinity.yaml
boundary_conditions: boundaries.yaml
operating_conditions: operating_conditions.yaml
controllers: controller.yaml
transients: transients.yaml
timings: timings.yaml
telemetry: telemetry.yaml
solver:
  transient:
    method: fixed_rk4
    rtol: 1.0e-7
    atol: 1.0e-6
    max_step: 0.1
analysis:
  type: profile
  solve_policy:
    checked: false
    residual_tolerance: 1.0e-6
    strict_sources: true
    corrector: endpoint
    corrector_iterations: 2
    preconditioner: design
    algebraic_solver: preconditioned_direct
    max_nfev: 20
  integration:
    segment_at_controller_samples: false
  time:
    start_s: 0.0
    end_s: 30.0
    phases:
      - name: startup
        start_s: 0.0
        end_s: 3.0
      - name: CLC
        start_s: 3.0
        end_s: 25.0
      - name: shutdown
        start_s: 25.0
        end_s: 30.0
  design:
    thrust: 150000.0
    chamber_pressure: 5.0e6
    mdot_total: 40.0
    OF: 3.2
  initial_conditions:
    shaft.rpm: 24000.0
    chamber.P: 4.0e6
    generator.P: 6.0e6
  output:
    csv: gg_single_shaft_methalox.csv
    plot: gg_single_shaft_methalox.png
    diagnostics: gg_single_shaft_methalox.diagnostics.json
  acceptance:
    report: gg_single_shaft_methalox.acceptance.json
    case: gg_single_shaft_methalox_generic_profile
    require_solver_source: generic_port
    evaluation_end_s: 24.99
    shaft_paths: [shaft.rpm]
    required_paths:
      - mdot.total
      - chamber.OF
      - nozzle.thrust
      - lox_pump.delta_P
      - methane_pump.delta_P
      - lox_generator_valve.position
      - methane_generator_valve.position
    tolerances:
      min_peak_thrust: 1.0e5
      final_mdot_rel: 1.05
      final_of_abs: 2.0
      mdot_tracking_rms_rel: 1.10
      min_shaft_speed_delta_rpm: 50.0
      max_normalized_residual: 1.0e6
  regression:
    case: 20_gg_single_shaft_methalox
    report: gg_single_shaft_methalox.regression.json
    windows:
      - name: peak_thrust
        channel: THRUST
        reducer: max
        minimum: 1.0e5
        maximum: 2.0e5
      - name: final_mdot
        channel: MDOT_TOTAL
        reducer: final
        minimum: 0.0
        maximum: 60.0
      - name: max_shaft_speed
        channel: SHAFT_RPM
        reducer: max
        minimum: 5.0e3
        maximum: 1.0e6
      - name: shutdown_thrust_decay
        channel: THRUST
        reducer: final
        minimum: 0.0
        maximum: 3.5e4
