name: ffsc_lox_ch4
units: SI
components:
  lox_shaft:
    type: Rotor
    parameters:
      moment_of_inertia: 0.08
      initial_speed_rpm: 32000
  fuel_shaft:
    type: Rotor
    parameters:
      moment_of_inertia: 0.05
      initial_speed_rpm: 27000
  lox_pump:
    type: Pump
    parameters:
      diameter: 0.085
      pump_map:
        mdot_design: 4.23
        dP_design: 16.6e6
        speed_design: 32000
        efficiency_design: 0.74
    maps:
      efficiency_map:
        ref: lox_pump_efficiency
        output: efficiency
  fuel_pump:
    type: Pump
    parameters:
      diameter: 0.060
      pump_map:
        mdot_design: 1.21
        dP_design: 16.6e6
        speed_design: 27000
        efficiency_design: 0.69
    maps:
      efficiency_map:
        ref: fuel_pump_efficiency
        output: efficiency
  ox_preburner:
    type: Preburner
    parameters:
      volume: 1.5e-4
      design_MR: 50.0
      efficiency: 0.94
      initial_P: 17.0e6
      initial_T: 730.0
  fuel_preburner:
    type: Preburner
    parameters:
      volume: 1.5e-4
      design_MR: 0.25
      efficiency: 0.94
      initial_P: 17.0e6
      initial_T: 680.0
  lox_turbine:
    type: Turbine
    parameters:
      diameter: 0.10
      turbine_map:
        PR_design: 2.2
        eta_design: 0.74
        mdot_corrected_design: 0.07
  fuel_turbine:
    type: Turbine
    parameters:
      diameter: 0.09
      turbine_map:
        PR_design: 2.0
        eta_design: 0.72
        mdot_corrected_design: 0.05
  regen:
    type: RegenChannel
    parameters:
      channel_area: 5.0e-5
      hydraulic_diam: 3.0e-3
      channel_length: 0.8
      hot_area: 0.15
      cool_area: 0.18
      wall_mass: 2.5
      wall_cp: 390.0
      h_hot_design: 8000.0
      Pc_design: 10.0e6
      recovery_factor: 0.90
      initial_T_wall: 300.0
  chamber:
    type: CombustionChamber
    parameters:
      volume: 3.0e-4
      efficiency: 0.97
      initial_P: 10.0e6
      initial_T: 3500.0
  nozzle:
    type: Nozzle
    parameters:
      throat_area: 1.03e-3
      exit_area: 5.15e-2
      efficiencies:
        eta_cstar: 0.975
        eta_divergence: 0.985
connections:
  - from: lox_pump.outlet
    to: ox_preburner.lox_inlet
    domain: fluid
  - from: fuel_pump.bleed_ox
    to: ox_preburner.fuel_inlet
    domain: fluid
  - from: ox_preburner.outlet
    to: lox_turbine.inlet
    domain: fluid
  - from: lox_turbine.outlet
    to: chamber.lox_inlet
    domain: fluid
  - from: fuel_pump.outlet
    to: regen.coolant_inlet
    domain: fluid
  - from: regen.coolant_outlet
    to: fuel_preburner.fuel_inlet
    domain: fluid
  - from: lox_pump.bleed_fuel
    to: fuel_preburner.lox_inlet
    domain: fluid
  - from: fuel_preburner.outlet
    to: fuel_turbine.inlet
    domain: fluid
  - from: fuel_turbine.outlet
    to: chamber.fuel_inlet
    domain: fluid
  - from: chamber.outlet
    to: nozzle.inlet
    domain: fluid
  - from: lox_turbine.shaft
    to: lox_shaft.turbine_in
    domain: shaft
  - from: lox_pump.shaft
    to: lox_shaft.pump
    domain: shaft
  - from: fuel_turbine.shaft
    to: fuel_shaft.turbine_in
    domain: shaft
  - from: fuel_pump.shaft
    to: fuel_shaft.pump
    domain: shaft
