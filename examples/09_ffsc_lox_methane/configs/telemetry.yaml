name: ffsc_lox_methane_telemetry
sample_rate_hz: 100
channels:
  - alias: PC
    source: chamber.P
    units: MPa
  - alias: THRUST
    source: nozzle.thrust
    units: N
  - alias: LOX_SHAFT
    source: lox_shaft.omega
    units: rpm
  - alias: FUEL_SHAFT
    source: fuel_shaft.omega
    units: rpm
exports:
  csv: true
  hdf5: true
