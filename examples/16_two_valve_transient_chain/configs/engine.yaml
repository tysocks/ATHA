name: two_valve_transient_chain
components:
  valve_a:
    type: Valve
    transient: valve_a_linear
    parameters:
      max_area: 2.0e-6
      discharge_coeff: 1.0
  pipe_a:
    type: Pipe
    parameters:
      length: 0.4
      diameter: 0.012
      time_constant: 0.18
  injector_a:
    type: MassFlowInjector
    parameters:
      delta_P_nominal: 1.5e5
  valve_b:
    type: Valve
    transient: valve_b_first_order
    parameters:
      max_area: 1.4e-6
      discharge_coeff: 1.0
  pipe_b:
    type: Pipe
    parameters:
      length: 0.5
      diameter: 0.010
      time_constant: 0.28
  injector_b:
    type: MassFlowInjector
    parameters:
      delta_P_nominal: 1.0e5
  chamber:
    type: CombustionChamber
    parameters:
      volume: 0.018
      gas_T: 3500.0
      gas_R: 420.0
  nozzle:
    type: Nozzle
    parameters:
      throat_area: 8.0e-5
      exit_area: 8.0e-4
      conductance: 1.2e-7
      thrust_coefficient: 1.45
connections:
  - from: valve_a.outlet
    to: pipe_a.inlet
    domain: fluid
  - from: pipe_a.outlet
    to: injector_a.inlet
    domain: fluid
  - from: injector_a.outlet
    to: chamber.ox_inlet
    domain: fluid
  - from: valve_b.outlet
    to: pipe_b.inlet
    domain: fluid
  - from: pipe_b.outlet
    to: injector_b.inlet
    domain: fluid
  - from: injector_b.outlet
    to: chamber.fuel_inlet
    domain: fluid
  - from: chamber.outlet
    to: nozzle.inlet
    domain: fluid
