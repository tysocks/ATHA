name: tca_pms_runbox_telemetry
sample_rate_hz: 100
channels:
  - alias: TIME
    source: time
    units: s
  - alias: MDOT_TOTAL
    source: pms.mdot_total
    units: kg/s
  - alias: OF
    source: pms.OF
  - alias: MDOT_LOX
    source: mdot.lox
    units: kg/s
  - alias: MDOT_FUEL
    source: mdot.fuel
    units: kg/s
  - alias: PC
    source: chamber.P
    units: MPa
  - alias: THRUST
    source: nozzle.thrust
    units: kN
exports:
  csv: true
  plot: true
