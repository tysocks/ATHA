name: tca_pms_runbox
engine: engine.yaml
boundary_conditions: boundaries.yaml
operating_conditions: operating_conditions.yaml
controllers: controllers.yaml
telemetry: telemetry.yaml
solver:
  steady_trim:
    tol: 1.0e-8
    max_iter: 200
  transient:
    method: Radau
    rtol: 1.0e-4
    atol: 1.0e-6
    max_step: 0.02
analysis:
  type: tca_pms_runbox
  fluids:
    oxidizer: Oxygen
    fuel: Methane
  combustion:
    mechanism: gri30.yaml
    fuel: CH4
    oxidizer: O2
    chamber_initial_X: H2O:0.60,CO2:0.25,CO:0.08,H2:0.07
  output:
    csv: tca_pms_runbox.csv
    plot: tca_pms_runbox.png
