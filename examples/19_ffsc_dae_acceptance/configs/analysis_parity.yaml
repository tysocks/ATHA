name: ffsc_dae_acceptance_parity
engine: engine.yaml
maps:
  lox_pump_affinity: maps/lox_pump_affinity.yaml
  methane_pump_affinity: maps/methane_pump_affinity.yaml
  lox_turbine_affinity: maps/lox_turbine_affinity.yaml
  methane_turbine_affinity: maps/methane_turbine_affinity.yaml
transients: transients.yaml
analysis:
  type: parity
  time:
    start_s: 0.0
    end_s: 30.0
    phases:
      - {name: startup, start_s: 0.0, end_s: 3.0}
      - {name: CLC, start_s: 3.0, end_s: 25.0}
      - {name: shutdown, start_s: 25.0, end_s: 30.0}
  parity:
    case: ffsc_dae_acceptance_generic_vs_legacy
    reference: analysis_legacy_transient.yaml
    candidate: analysis.yaml
    report: ffsc_dae_acceptance.parity.json
    delta_csv: ffsc_dae_acceptance.parity_delta.csv
    windows:
      - {name: startup, start_s: 0.0, end_s: 3.0}
      - {name: CLC, start_s: 3.0, end_s: 25.0}
      - {name: shutdown, start_s: 25.0, end_s: 30.0}
    channels:
      - {name: mdot_total, channel: MDOT_TOTAL, category: plant, rtol: 0.20, rms_rtol: 0.12, final_rtol: 0.20}
      - {name: of_ratio, channel: OF, category: plant, atol: 0.75, rms_atol: 0.50, final_atol: 0.75}
      - {name: thrust, channel: THRUST, category: plant, rtol: 0.25, rms_rtol: 0.18, final_rtol: 0.25}
      - {name: lox_shaft_speed, channel: LOX_SHAFT_RPM, category: shaft, rtol: 0.10, rms_rtol: 0.08, final_rtol: 0.10}
      - {name: methane_shaft_speed, channel: METHANE_SHAFT_RPM, category: shaft, rtol: 0.10, rms_rtol: 0.08, final_rtol: 0.10}
      - {name: main_lox_valve, channel: MAIN_LOX_VALVE_POSITION, category: transient, atol: 0.08, rms_atol: 0.05, final_atol: 0.08}
      - {name: main_methane_valve, channel: MAIN_METHANE_VALVE_POSITION, category: transient, atol: 0.08, rms_atol: 0.05, final_atol: 0.08}
      - {name: methane_crossover_valve, channel: METHANE_CROSSOVER_VALVE_POSITION, category: controller, atol: 0.12, rms_atol: 0.08, final_atol: 0.12}
      - {name: lox_crossover_valve, channel: LOX_CROSSOVER_VALVE_POSITION, category: controller, atol: 0.12, rms_atol: 0.08, final_atol: 0.12}
