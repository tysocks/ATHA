name: ffsc_dae_acceptance_reduced_cycle_profile
engine: engine.yaml
maps:
  lox_pump_affinity: maps/lox_pump_affinity.yaml
  methane_pump_affinity: maps/methane_pump_affinity.yaml
  lox_turbine_affinity: maps/lox_turbine_affinity.yaml
  methane_turbine_affinity: maps/methane_turbine_affinity.yaml
boundary_conditions: boundaries.yaml
operating_conditions: operating_conditions.yaml
controllers: controller.yaml
transients: transients.yaml
timings: timings.yaml
telemetry: telemetry.yaml
solver:
  transient:
    method: Radau
    rtol: 1.0e-7
    atol: 1.0e-6
    max_step: 0.05
analysis:
  type: profile
  reduced_cycle:
    provider: ffsc_reduced
  integration:
    segment_at_controller_samples: false
  time:
    start_s: 0.0
    end_s: 30.0
    phases:
      - name: startup
        start_s: 0.0
        end_s: 3.0
      - name: CLC
        start_s: 3.0
        end_s: 25.0
      - name: shutdown
        start_s: 25.0
        end_s: 30.0
  fluids:
    oxidizer: Oxygen
    fuel: Methane
  combustion:
    mechanism: gri30.yaml
    fuel: CH4
    oxidizer: O2
    chamber_initial_X: H2O:0.60,CO2:0.25,CO:0.08,H2:0.07
    gas_T: 3500.0
  design:
    thrust: 150000.0
    chamber_pressure: 5.0e6
    mdot_total: 40.0
    OF: 3.2
    mdot_lox: 30.48
    mdot_methane: 9.52
  initial_conditions:
    lox_shaft.omega: 3350.0
    methane_shaft.omega: 2825.0
    chamber.P: 5.0e6
    chamber.T: 3500.0
    ox_preburner.P: 8.0e6
    fuel_preburner.P: 8.0e6
  output:
    csv: ffsc_dae_acceptance_reduced_cycle_profile.csv
    plot: ffsc_dae_acceptance_reduced_cycle_profile.png
    diagnostics: ffsc_dae_acceptance_reduced_cycle_profile.diagnostics.json
