name: ffsc_dae_acceptance
engine: engine.yaml
maps:
  lox_pump_affinity: maps/lox_pump_affinity.yaml
  methane_pump_affinity: maps/methane_pump_affinity.yaml
  lox_turbine_affinity: maps/lox_turbine_affinity.yaml
  methane_turbine_affinity: maps/methane_turbine_affinity.yaml
boundary_conditions: boundaries.yaml
operating_conditions: operating_conditions.yaml
controllers: controller.yaml
transients: transients.yaml
timings: timings.yaml
telemetry: telemetry.yaml
solver:
  transient:
    method: fixed_rk4
    rtol: 1.0e-7
    atol: 1.0e-6
    max_step: 0.10
analysis:
  type: profile
  solve_policy:
    allow_non_square: true
    checked: false
    residual_tolerance: 1.0e-6
    strict_sources: true
    corrector: endpoint
    corrector_iterations: 2
    preconditioner: design
    algebraic_solver: preconditioned_direct
    max_nfev: 20
  integration:
    segment_at_controller_samples: false
  time:
    start_s: 0.0
    end_s: 30.0
    # Canonical ATHA mission-cycle phase set for Workstream 6.1.
    phases:
      - name: prestart
        start_s: 0.0
        end_s: 1.0
      - name: startup
        start_s: 1.0
        end_s: 3.0
      - name: CLC
        start_s: 3.0
        end_s: 10.0
      - name: throttle
        start_s: 10.0
        end_s: 20.0
      - name: CLC_recover
        start_s: 20.0
        end_s: 25.0
      - name: shutdown
        start_s: 25.0
        end_s: 28.0
      - name: rundown
        start_s: 28.0
        end_s: 30.0
  fluids:
    oxidizer: Oxygen
    fuel: Methane
  combustion:
    mechanism: gri30.yaml
    fuel: CH4
    oxidizer: O2
    chamber_initial_X: H2O:0.60,CO2:0.25,CO:0.08,H2:0.07
    gas_T: 3500.0
  design:
    thrust: 150000.0
    chamber_pressure: 5.0e6
    mdot_total: 40.0
    OF: 3.2
    mdot_lox: 30.48
    mdot_methane: 9.52
  initial_conditions:
    lox_shaft.omega: 3350.0
    methane_shaft.omega: 2825.0
    chamber.P: 5.0e6
    chamber.T: 3500.0
    ox_preburner.P: 8.0e6
    fuel_preburner.P: 8.0e6
  output:
    csv: ffsc_dae_acceptance.csv
    plot: ffsc_dae_acceptance.png
    diagnostics: ffsc_dae_acceptance.diagnostics.json
  linearization:
    enabled: true
    output: ffsc_dae_acceptance.linearization.json
    perturbations:
      state_default: 1.0e-6
      input_default: 1.0e-5
  acceptance:
    description: Canonical FFSC full mission-cycle generic-port DAE profile case.
    report: ffsc_dae_acceptance.acceptance.json
    case: ffsc_dae_acceptance_generic_profile
    require_solver_source: generic_port
    evaluation_end_s: 24.99
    shaft_paths: [lox_shaft.rpm, methane_shaft.rpm]
    required_paths:
      - mdot.total
      - chamber.OF
      - nozzle.thrust
      - lox_pump.inlet.mdot
      - methane_pump.inlet.mdot
      - methane_crossover_valve.position
      - lox_crossover_valve.position
    tolerances:
      final_mdot_rel: 0.35
      final_thrust_rel: 0.35
      final_of_abs: 3.0
      mdot_tracking_rms_rel: 0.35
      of_tracking_rms_abs: 1.75
      min_peak_thrust: 1.0e5
      min_powered_tail_thrust: 1.0e5
      powered_tail_s: 10.0
      min_shaft_speed_delta_rpm: 100.0
      max_normalized_residual: 1.0e6
    expected_behavior:
      - mdot_total target changes drive methane_crossover_valve.command.
      - OF target changes drive lox_crossover_valve.command.
      - preburner branch flow changes alter turbine torque.
      - turbine torque changes lox_shaft.omega and methane_shaft.omega.
      - pump pressure rise changes through affinity-law map behavior.
      - chamber flow and thrust settle near 150 kN at the 40 kg/s target.
      - sustained powered-tail thrust remains above min_powered_tail_thrust (strict gate).
      - controllers are inactive in prestart/startup/shutdown/rundown and active in CLC/throttle/CLC_recover.
