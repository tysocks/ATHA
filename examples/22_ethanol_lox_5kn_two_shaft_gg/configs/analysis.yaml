name: ethanol_lox_5kn_two_shaft_gg
engine: engine.yaml
boundary_conditions: boundaries.yaml
operating_conditions: operating_conditions.yaml
controllers: controller.yaml
transients: transients.yaml
timings: timings.yaml
telemetry: telemetry.yaml
solver:
  transient:
    method: fixed_rk4
    rtol: 1.0e-7
    atol: 1.0e-8
    max_step: 0.05
analysis:
  type: profile
  solve_policy:
    allow_non_square: true
    checked: false
    residual_tolerance: 1.0e-6
    strict_sources: true
    corrector: endpoint
    corrector_iterations: 2
    preconditioner: design
    algebraic_solver: preconditioned_direct
    max_nfev: 20
  integration:
    segment_at_controller_samples: false
  time:
    start_s: 0.0
    end_s: 10.0
    phases:
      - {name: startup, start_s: 0.0, end_s: 2.0}
      - {name: CLC, start_s: 2.0, end_s: 8.0}
      - {name: shutdown, start_s: 8.0, end_s: 10.0}
  fluids:
    oxidizer: Oxygen
    fuel: Ethanol
  design:
    thrust: 5000.0
    isp_s: 245.0
    chamber_pressure: 1.4e6
    generator_pressure: 2.0e6
    mdot_total: 2.08
    OF: 1.35
    mdot_lox: 1.195
    mdot_fuel: 0.885
    lox_shaft_rpm: 26000.0
    fuel_shaft_rpm: 30000.0
  initial_conditions:
    lox_shaft.rpm: 21000.0
    fuel_shaft.rpm: 24000.0
    chamber.P: 6.0e5
    generator.P: 1.2e6
  output:
    csv: ethanol_lox_5kn_two_shaft_gg.csv
    plot: ethanol_lox_5kn_two_shaft_gg.png
    diagnostics: ethanol_lox_5kn_two_shaft_gg.diagnostics.json
  acceptance:
    report: ethanol_lox_5kn_two_shaft_gg.acceptance.json
    case: ethanol_lox_5kn_two_shaft_gg
    require_solver_source: generic_port
    evaluation_end_s: 7.99
    shaft_paths: [lox_shaft.rpm, fuel_shaft.rpm]
    required_paths:
      - mdot.total
      - chamber.OF
      - nozzle.thrust
      - lox_pump.delta_P
      - fuel_pump.delta_P
      - lox_generator_valve.position
      - fuel_generator_valve.position
    tolerances:
      min_peak_thrust: 4000.0
      final_mdot_rel: 1.10
      final_of_abs: 1.25
      mdot_tracking_rms_rel: 1.10
      min_shaft_speed_delta_rpm: 50.0
      max_normalized_residual: 1.0e6
  regression:
    case: ethanol_lox_5kn_two_shaft_gg
    report: ethanol_lox_5kn_two_shaft_gg.regression.json
    windows:
      - {name: peak_thrust, channel: THRUST, reducer: max, minimum: 4000.0, maximum: 7000.0}
      - {name: final_thrust_decay, channel: THRUST, reducer: final, minimum: 0.0, maximum: 2500.0}
      - {name: peak_mdot, channel: MDOT_TOTAL, reducer: max, minimum: 1.0, maximum: 3.5}
      - {name: max_lox_speed, channel: LOX_SHAFT_RPM, reducer: max, minimum: 18000.0, maximum: 40000.0}
      - {name: max_fuel_speed, channel: FUEL_SHAFT_RPM, reducer: max, minimum: 20000.0, maximum: 120000.0}
