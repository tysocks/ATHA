name: ethanol_lox_5kn_two_shaft_gg_engine
units: SI
components:
  lox_shaft:
    type: Rotor
    parameters: {inertia: 0.020, friction: 0.10}
  fuel_shaft:
    type: Rotor
    parameters: {inertia: 0.012, friction: 0.12}
  lox_pump:
    type: Pump
    parameters: {efficiency: 0.62, design_delta_P: 1.9e6}
  fuel_pump:
    type: Pump
    parameters: {efficiency: 0.58, design_delta_P: 1.5e6}
  main_lox_valve:
    type: Valve
    transient: main_lox_valve
    parameters: {CdA: 3.5e-5}
  main_fuel_valve:
    type: Valve
    transient: main_fuel_valve
    parameters: {CdA: 2.8e-5}
  lox_generator_valve:
    type: Valve
    transient: lox_generator_valve
    parameters: {CdA: 7.0e-6}
  fuel_generator_valve:
    type: Valve
    transient: fuel_generator_valve
    parameters: {CdA: 5.5e-6}
  gas_generator:
    type: Preburner
    parameters: {volume: 0.0015}
  lox_turbine:
    type: Turbine
    parameters: {efficiency: 0.58}
  fuel_turbine:
    type: Turbine
    parameters: {efficiency: 0.56}
  chamber:
    type: CombustionChamber
    parameters: {volume: 0.003}
  nozzle:
    type: Nozzle
    parameters: {thrust_coefficient: 1.45}
connections:
  - {from: lox_pump.outlet, to: main_lox_valve.inlet}
  - {from: fuel_pump.outlet, to: main_fuel_valve.inlet}
  - {from: main_lox_valve.outlet, to: chamber.lox_inlet}
  - {from: main_fuel_valve.outlet, to: chamber.fuel_inlet}
  - {from: lox_generator_valve.outlet, to: gas_generator.lox_inlet}
  - {from: fuel_generator_valve.outlet, to: gas_generator.fuel_inlet}
  - {from: gas_generator.outlet, to: lox_turbine.inlet}
  - {from: gas_generator.outlet, to: fuel_turbine.inlet}
  - {from: chamber.outlet, to: nozzle.inlet}
  - {from: lox_turbine.shaft, to: lox_shaft.shaft}
  - {from: fuel_turbine.shaft, to: fuel_shaft.shaft}
  - {from: lox_shaft.shaft, to: lox_pump.shaft}
  - {from: fuel_shaft.shaft, to: fuel_pump.shaft}
