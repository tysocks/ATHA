name: single_lox_pump_map_transients
transients:
  pump_speed:
    type: first_order
    input: pump_speed.command
    output: lox_pump.shaft.omega
    initial: 0.0
    parameters:
      time_constant: 0.1
      lower_limit: 0.0
      upper_limit: 6000.0  # rad/s, approximately 57,300 rpm
  control_valve:
    type: first_order
    input: control_valve.command
    output: control_valve.position
    initial: 0.0
    parameters:
      time_constant: 0.1
      lower_limit: 0.0
      upper_limit: 1.0
