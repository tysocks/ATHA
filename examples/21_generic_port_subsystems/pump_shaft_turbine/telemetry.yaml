name: pump_shaft_turbine_telemetry
sample_rate_hz: 2
channels:
  - {alias: TIME, source: time, units: s}
  - {alias: TARGET_MDOT_TOTAL, source: target.mdot_total, units: kg/s}
  - {alias: MDOT_TOTAL, source: mdot.total, units: kg/s}
  - {alias: OF, source: chamber.OF}
  - {alias: SHAFT_RPM, source: shaft.rpm, units: rpm}
  - {alias: PUMP_POWER, source: pump.power, units: W}
  - {alias: TURBINE_POWER, source: turbine.power, units: W}
  - {alias: PUMP_TAU, source: pump.tau_load}
  - {alias: TURBINE_TAU, source: turbine.tau_drive}
exports: {csv: true, plot: true}
plots:
  - {title: Shaft, x: TIME, y: [SHAFT_RPM], ylabel: Speed}
  - {title: Power, x: TIME, y: [PUMP_POWER, TURBINE_POWER], ylabel: Power}
