name: chamber_nozzle_generic_port
engine: ../generic_engine.yaml
operating_conditions: operating_conditions.yaml
telemetry: telemetry.yaml
analysis:
  type: profile
  time: {start_s: 0.0, end_s: 3.0}
  solve_policy: {residual_tolerance: 1.0e-6}
  trim: {enabled: true}
  output:
    csv: chamber_nozzle.csv
    plot: chamber_nozzle.png
    diagnostics: chamber_nozzle.profile.json
  balances:
    mdot_total:
      residual: {expression: mdot.total - targets.mdot_total, scale: 10.0}
      variable: mdot.total
    of_ratio:
      residual: {expression: chamber.OF - targets.OF, scale: 4.0}
      variable: chamber.OF
    chamber_pressure:
      residual: {expression: chamber.P - 5000000.0, scale: 5000000.0}
      variable: chamber.P
    chamber_temperature:
      residual: {expression: chamber.T - 3500.0, scale: 4000.0}
      variable: chamber.T
    nozzle_mdot:
      residual: {expression: nozzle.mdot - mdot.total, scale: 10.0}
      variable: nozzle.mdot
    c_star:
      residual: {expression: nozzle.c_star - 1600.0, scale: 2000.0}
      variable: nozzle.c_star
    thrust:
      residual: {expression: nozzle.thrust - 3500.0 * nozzle.mdot, scale: 50000.0}
      variable: nozzle.thrust
  acceptance:
    report: chamber_nozzle.acceptance.json
    case: chamber_nozzle_generic_port
    tolerances: {final_mdot_rel: 0.05, final_of_abs: 0.05, min_peak_thrust: 10000.0, max_normalized_residual: 1.0e-6}
