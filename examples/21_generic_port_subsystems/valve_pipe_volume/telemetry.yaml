name: valve_pipe_volume_telemetry
sample_rate_hz: 2
channels:
  - {alias: TIME, source: time, units: s}
  - {alias: TARGET_MDOT_TOTAL, source: target.mdot_total, units: kg/s}
  - {alias: MDOT_TOTAL, source: mdot.total, units: kg/s}
  - {alias: OF, source: chamber.OF}
  - {alias: VALVE_COMMAND, source: valve.command}
  - {alias: VALVE_POSITION, source: valve.position}
  - {alias: PIPE_MDOT, source: pipe.mdot, units: kg/s}
  - {alias: VOLUME_P, source: volume.P, units: Pa}
exports: {csv: true, plot: true}
plots:
  - {title: Flow, x: TIME, y: [TARGET_MDOT_TOTAL, MDOT_TOTAL], ylabel: Mass flow}
  - {title: Valve, x: TIME, y: [VALVE_COMMAND, VALVE_POSITION], ylabel: Position}
