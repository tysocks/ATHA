name: chamber_startup_transient
engine: engine.yaml
operating_conditions: operating_conditions.yaml
telemetry: telemetry.yaml
analysis:
  type: profile
  time:
    start_s: 0.0
    end_s: 3.0
    phases:
      - name: prestart
        start_s: 0.0
        end_s: 0.15
      - name: ignition
        start_s: 0.15
        end_s: 1.5
        advance_when: {path: chamber.P, op: ">=", value: 4.0e6}
      - name: powered
        start_s: 1.5
        end_s: 3.0
  solve_policy: {residual_tolerance: 1.0e-4, checked: false}
  trim: {enabled: true}
  design:
    thrust: 35000.0
    chamber_pressure: 5.0e6
    mdot_total: 10.0
    OF: 3.2
  output:
    csv: chamber_startup_transient.csv
    plot: chamber_startup_transient.png
    diagnostics: chamber_startup_transient.diagnostics.json
  # Reduced-order ignition envelope after t=0.15 s. Unlike chamber_nozzle's
  # flat algebraic targets, these first-order rises make Pc/thrust rise-time
  # correlation meaningful for Workstream 6.5.
  balances:
    mdot_total:
      residual:
        expression: mdot.total - (10.0 * (1.0 - exp(-max(time - 0.15, 0.0) / 0.45)))
        scale: 10.0
      variable: mdot.total
      bounds: [0.0, 12.0]
    of_ratio:
      residual: {expression: chamber.OF - targets.OF, scale: 4.0}
      variable: chamber.OF
      bounds: [1.0, 6.0]
    chamber_pressure:
      residual:
        expression: chamber.P - (100000.0 + 4900000.0 * (1.0 - exp(-max(time - 0.15, 0.0) / 0.45)))
        scale: 5000000.0
      variable: chamber.P
      bounds: [100000.0, 6000000.0]
    chamber_temperature:
      residual: {expression: chamber.T - 3500.0, scale: 4000.0}
      variable: chamber.T
    nozzle_mdot:
      residual: {expression: nozzle.mdot - mdot.total, scale: 10.0}
      variable: nozzle.mdot
      bounds: [0.0, 12.0]
    c_star:
      residual: {expression: nozzle.c_star - 1600.0, scale: 2000.0}
      variable: nozzle.c_star
    thrust:
      residual: {expression: nozzle.thrust - 3500.0 * nozzle.mdot, scale: 50000.0}
      variable: nozzle.thrust
      bounds: [0.0, 50000.0]
  acceptance:
    report: chamber_startup_transient.acceptance.json
    case: chamber_startup_transient
    require_solver_source: generic_port
    evaluation_end_s: 2.99
    required_paths:
      - mdot.total
      - chamber.P
      - chamber.OF
      - nozzle.thrust
      - nozzle.c_star
    tolerances:
      min_peak_thrust: 15000.0
      min_powered_tail_thrust: 10000.0
      powered_tail_s: 0.5
      final_thrust_rel: 0.35
      final_mdot_rel: 0.35
      mdot_tracking_rms_rel: 0.50
      final_of_abs: 0.25
      max_normalized_residual: 1.0e-4
