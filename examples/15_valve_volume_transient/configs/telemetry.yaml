name: valve_volume_telemetry
sample_rate_hz: 100
channels:
  - alias: TIME
    source: time
    units: s
  - alias: VALVE_COMMAND
    source: valve.command
  - alias: VALVE_POSITION
    source: valve.position
  - alias: P_DOWNSTREAM
    source: downstream.P
    units: bar
  - alias: MDOT_IN
    source: valve.mdot
    units: kg/s
  - alias: MDOT_OUT
    source: outlet.mdot
    units: kg/s
exports:
  csv: true
  plot: true
plots:
  - title: Valve Command And Position
    x: TIME
    y: [VALVE_COMMAND, VALVE_POSITION]
    ylabel: Position [-]
  - title: Downstream Pressure
    x: TIME
    y: [P_DOWNSTREAM]
    ylabel: Pressure [bar]
  - title: Flow Response
    x: TIME
    y: [MDOT_IN, MDOT_OUT]
    ylabel: Mass flow [kg/s]
