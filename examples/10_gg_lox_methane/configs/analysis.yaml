name: gg_lox_methane
engine: engine.yaml
maps:
  lox_pump_efficiency: maps/lox_pump_efficiency.yaml
  fuel_pump_efficiency: maps/fuel_pump_efficiency.yaml
boundary_conditions: boundaries.yaml
telemetry: telemetry.yaml
solver:
  steady_trim:
    tol: 1.0e-8
    max_iter: 200
analysis:
  type: nominal_mc_sweep
  fluids:
    oxidizer: Oxygen
    fuel: Methane
  combustion:
    mechanism: gri30.yaml
    fuel: CH4
    oxidizer: O2
    chamber_initial_X: H2O:0.60,CO2:0.25,CO:0.08,H2:0.07
    gas_T: 3500.0
  design:
    Pc: 10.0e6
  monte_carlo:
    samples: 100
    sampler: lhs
    n_jobs: -1
    seed: 11
    result_file: gg_lox_methane_mc.hdf5
    histogram_file: gg_lox_methane_mc.png
    parameters:
      - name: lox_eta_scale
        distribution: normal
        settings: {mean: 1.0, std: 0.025}
      - name: fuel_eta_scale
        distribution: normal
        settings: {mean: 1.0, std: 0.025}
      - name: gg_efficiency
        distribution: normal
        settings: {mean: 0.93, std: 0.02}
      - name: T_lox_inlet
        distribution: normal
        settings: {mean: 91.0, std: 0.8}
      - name: T_fuel_inlet
        distribution: normal
        settings: {mean: 108.0, std: 1.0}
  speed_sweep:
    rpm_min: 15000
    rpm_max: 33000
    points: 15
    plot_file: gg_lox_methane_speed_sweep.png
