name: ci

on:
  push:
    branches: [master, main, "cursor/**"]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint (maintained Workstream 6.x surfaces)
        # Full-repo Ruff cleanup remains optional; gate the new/maintained surfaces.
        run: >
          python -m ruff check
          atha/config/mission_phases.py
          atha/validation/acceptance.py
          tests/test_mission_phases.py
          tests/test_acceptance_hardening.py
      - name: Fast pytest
        run: >
          python -m pytest
          tests/test_level0_reference_checks.py
          tests/test_quality_and_benchmarks.py
          tests/test_historical_correlation.py
          tests/test_mission_phases.py
          tests/test_acceptance_hardening.py
          tests/test_verification_subsystems.py
          -q
